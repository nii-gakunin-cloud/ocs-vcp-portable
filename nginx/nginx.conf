    server {
        listen 8888;
        server_name localhost;

        location /jupyter/ {
            proxy_pass http://jupyter:8888/jupyter/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }

        # grafanaに subdir /grafana/ でアクセスできるようにする
        location /grafana/ {
            proxy_pass http://occtr:3000/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
        # Proxy Grafana Live WebSocket connections.
        location /grafana/api/live/ {
            proxy_pass http://occtr:3000/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
        location /consul/ {
            proxy_pass http://occtr:8500/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
        location /ui/ {
            proxy_pass http://occtr:8500/ui/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
    }
}
