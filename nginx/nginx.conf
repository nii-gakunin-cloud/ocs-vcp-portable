user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    client_max_body_size 100m;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    #include /etc/nginx/conf.d/*.conf;

    index   index.html index.htm;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream grafana {
       server localhost:3000;
    }

    upstream jupyter {
       server jupyter:8080;
    }

    upstream consul {
       server occtr:8500;
    }

    server {
        listen 8080;
        server_name localhost;
    # HTTPS
    #     listen 10443 ssl;
    #     listen [::]:10443 ssl;
    #     server_name $host;
    #     ssl_certificate      /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        location /jupyter/ {
            proxy_pass http://jupyter/jupyter/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }

        # grafanaに subdir /grafana/ でアクセスできるようにする
        location /grafana/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana;
        }

        # Proxy Grafana Live WebSocket connections.
        location /grafana/api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://grafana;
        }
        # Consul ui
        location /consul/ {
            proxy_pass http://consul/consul/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
        # consul HTTP API (does not support subdir)
        location /v1/ {
            proxy_pass http://consul/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
        }
        # # prometheus
        # location /prometheus/ {
        #     proxy_pass http://occtr:9090/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $http_host;
        #     proxy_set_header Origin http://$http_host;
        # }
    }
}
