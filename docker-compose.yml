services:
  occtr:
    image: harbor.vcloud.nii.ac.jp/vcp/occtr:26.10.0
    # networks:
    #   - vcp-internal
    volumes:
      - ./cert:/opt/occ/httpd/cert/:ro
      - ./config:/opt/occ/config:ro
      - ./volume/opt/occ/var:/opt/occ/var
      - ./volume/opt/occ/.ssh:/opt/occ/.ssh
      - ./volume/opt/occ/vc:/opt/occ/vc
    environment:
      - VCP_VCC_PRIVATE_IPMASK=${VCP_VCC_PRIVATE_IPMASK:?VCP_VCC_PRIVATE_IPMASK environment variable is required}
      - VCP_OFFICIAL_REGISTRY_ADDRESS=${VCP_OFFICIAL_REGISTRY_ADDRESS:-harbor.vcloud.nii.ac.jp}
      - CONSUL_BASE_URL=${CONSUL_BASE_URL:-http://127.0.0.1:8500/v1/} # consul HTTP API
      - CONSUL_UI_CONTENT_PATH=${CONSUL_UI_CONTENT_PATH:-/consul} # consul agent option
      - CONSUL_NODE_NAME=${CONSUL_NODE_NAME:-portable_occtr}
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - MANAGE_VAULT=true
      - VAULT_API_URL=https://vault:8200/v1
  nginx:
    # networks:
    #   - vcp-public
    image: nginx
    ports:
      - "8080:8080"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # httpsの場合
      #  - ./nginx/certs:/etc/nginx/certs:ro
    # environment:
      #  - host=<fqdn>
  jupyter:
    image: harbor.vcloud.nii.ac.jp/vcpjupyter/cloudop-notebook:lab-4.5.7-simple
    # networks:
    #   - vcp-internal
    user: root
    volumes:
      - ./cert/occtr_ca.crt:/usr/local/share/ca-certificates/occtr_ca.crt:ro
      - ./jupyter-work:/home/jovyan/work
      - jupyter-data:/home/jovyan/.jupyter
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - TZ=JST-9
      - JUPYTER_PORT=8888
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
    # Full config: https://jupyter-server.readthedocs.io/en/latest/users/configuration.html
    command:
      - start-notebook.py
      - --ServerApp.base_url=/jupyter/
  registry:
    image: registry:3
    # networks:
    #   - vcp-internal
    ports:
      - "5000:5000"
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://harbor.vcloud.nii.ac.jp
    volumes:
      - registry-data:/var/lib/registry
  grafana:
    image: grafana/grafana:12.2.0
    # networks:
    #   - monitoring
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD environment variable is required}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
  prometheus:
    image: prom/prometheus:v2.49.0
    # networks:
    #   - monitoring
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./prometheus/targets.json:/etc/prometheus/targets.json
  serf:
    build:
      context: ./serf
    ports:
      - "7947:7947"
    volumes:
      - ./prometheus/targets.json:/etc/prometheus/targets.json
      - serf-data:/usr/share/serf/snapshot
    command: [
      "agent",
      "-node=${SERF_NODE:-serf}",
      "-rpc-addr=${SERF_RPC_ADDR:-0.0.0.0:7373}",
      "-bind=${SERF_BIND_ADDR:-0.0.0.0:7947}",
      "-discover=${SERF_DISCOVER:-portable_vcc_cluster}",
      "-advertise=${SERF_ADVERTISE:?Set host IP address to advertise to other nodes in the cluster}",
      "-event-handler=/usr/local/bin/event-handler.sh",
      "-snapshot=/usr/share/serf/snapshot",
      "-tag=role=pvcc"
    ]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.3
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg:ro
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  vault:
    build:
      context: ./vault
    volumes:
      - ./cert:/bao/cert:ro
      - ./vault/data:/bao/data
volumes:
  jupyter-data:
  registry-data:
  grafana-data:
  prometheus-data:
  serf-data:
